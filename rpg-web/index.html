<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0710" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>《逐玉》· 视觉小说</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand__title">《逐玉》</div>
          <div class="brand__subtitle">古风乙女 · 视觉小说</div>
        </div>
      </header>

      <main class="main">
        <section class="panel">
          <div class="panel__head">
            <div class="chapter" id="chapter"></div>
            <div class="panel__actions">
              <button class="btn btn--ghost" id="btnNew">新局</button>
              <button class="btn btn--ghost" id="btnSave">存档</button>
              <button class="btn btn--ghost" id="btnLoad">读档</button>
              <button class="btn btn--ghost" id="btnExport">导出</button>
              <label class="btn btn--ghost file">
                导入
                <input type="file" id="importFile" accept="application/json" />
              </label>
            </div>
          </div>

          <article class="scene">
            <h1 class="scene__title" id="sceneTitle"></h1>
            <div class="scene__image" id="sceneImageWrap" style="display:none;">
              <img class="scene__imageImg" id="sceneImage" alt="" />
            </div>
            <div class="scene__text" id="sceneText"></div>
          </article>

          <section class="choices">
            <div class="choices__title">· 命运抉择 ·</div>
            <div class="choices__list" id="choices"></div>
          </section>
        </section>

        <aside class="sidebar">
          <section class="card">
            <div class="card__title">· 人 物 ·</div>
            <div class="card__body" id="roleCard"></div>
          </section>

          <section class="card">
            <div class="card__title">· 记 忆 ·</div>
            <div class="card__body log" id="log"></div>
          </section>

          <section class="card">
            <div class="card__title">· 说 明 ·</div>
            <div class="card__body hint">
              <div>无需构建，直接在浏览器中运行。</div>
              <div>每次选择皆留痕迹，存档随时可取。</div>
              <div class="hint__small" id="buildInfo"></div>
            </div>
          </section>
        </aside>
      </main>

      <footer class="footer">
        <div class="footer__left">《逐玉》· 剧情节点 · 条件分支 · 属性变化 · 存档系统</div>
        <div class="footer__right">
          <span class="pill">本地存档</span>
        </div>
      </footer>
    </div>

    <script src="./src/content.js"></script>
    <script src="./src/engine.js"></script>
    <script src="./src/storage.js"></script>
    <script src="./src/main.js"></script>
  </body>
</html>
